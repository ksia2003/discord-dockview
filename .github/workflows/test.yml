name: test
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Build the pinned official Vencord and the independent DockView runtime.
            - name: Prepare independent runtime bundles
              run: pnpm prepareVencord

            - name: Verify disjoint runtime ownership
              run: node scripts/verify-runtime-bundles.mjs

            - name: Run tests
              run: pnpm test

            - name: Test if it compiles
              run: |
                  pnpm build
                  pnpm build --dev
