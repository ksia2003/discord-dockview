name: Release

on:
    push:
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

jobs:
    prepare-release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Verify tag and create the prerelease page
              shell: bash
              run: |
                  TAG=$(node scripts/print-dockview-release-metadata.mjs --field tag)
                  if [[ "${{ github.ref_type }}" == "tag" ]]; then
                      test "${{ github.ref_name }}" = "$TAG"
                  fi
                  if ! gh release view "$TAG" >/dev/null 2>&1; then
                      gh release create "$TAG" --verify-tag --prerelease \
                          --title "dockview ${TAG#v}" \
                          --notes "Development prerelease; platform builds and the verified manifest are still in progress."
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    release:
        needs: prepare-release
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
                include:
                    - os: macos-latest
                      platform: mac
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify pushed tag matches DockView metadata
              if: github.ref_type == 'tag'
              shell: bash
              run: |
                  TAG=$(node scripts/print-dockview-release-metadata.mjs --field tag)
                  test "${{ github.ref_name }}" = "$TAG"

            - name: Prepare bundled Vencord with DockView
              run: node scripts/prepare-vencord.mjs

            - name: Verify complete generated Vencord output
              run: node scripts/vencord-candidate.mjs verify-generated static/vencordDist

            - name: Verify DockView release metadata
              run: node scripts/verify-dockview-release-metadata.mjs --version-file static/vencordDist/version.txt

            - name: Build
              run: pnpm build

            - name: Run Electron Builder
              if: ${{ matrix.platform != 'mac' }}
              run: |
                  pnpm electron-builder --${{ matrix.platform }} --publish never

            - name: Run Electron Builder
              if: ${{ matrix.platform == 'mac' }}
              shell: bash
              run: |
                  if [[ -n "$CSC_LINK" && -n "$API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
                      echo "$API_KEY" > apple.p8
                      pnpm electron-builder --mac --publish never
                  else
                      unset CSC_LINK CSC_KEY_PASSWORD API_KEY APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
                      export CSC_IDENTITY_AUTO_DISCOVERY=false
                      pnpm electron-builder --mac --publish never --config.mac.notarize=false
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT }}
                  CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
                  API_KEY: ${{ secrets.APPLE_API_KEY }}
                  APPLE_API_KEY: apple.p8
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

            # electron-builder derives its GitHub tag from the Vesktop app version
            # (v1.6.5), while DockView releases use the independent plugin/shell
            # version (v0.1.x). Build locally, then upload every platform artifact to
            # the already-created DockView prerelease instead of letting
            # electron-builder create a second, incorrectly tagged draft release.
            - name: Attach platform packages to the DockView prerelease
              shell: bash
              run: |
                  TAG=$(node scripts/print-dockview-release-metadata.mjs --field tag)
                  shopt -s nullglob
                  files=(dist/*.exe dist/*.AppImage dist/*.deb dist/*.rpm dist/*.tar.gz \
                         dist/*.zip dist/*.blockmap dist/latest*.yml)
                  test ${#files[@]} -gt 0
                  gh release upload "$TAG" "${files[@]}" --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Attach DockView runtime bundle
              if: matrix.platform == 'linux'
              shell: bash
              run: |
                  TAG=$(node scripts/print-dockview-release-metadata.mjs --field tag)
                  shopt -s nullglob
                  files=(static/vencordDist/vencordDesktopMain.js static/vencordDist/vencordDesktopPreload.js \
                         static/vencordDist/vencordDesktopRenderer.js static/vencordDist/vencordDesktopRenderer.css \
                         static/vencordDist/version.txt static/vencordDist/chunk-*.js)
                  gh release upload "$TAG" "${files[@]}" --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    manifest:
        needs: release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Generate and attach the verified update manifest
              shell: bash
              run: |
                  TAG=$(node scripts/print-dockview-release-metadata.mjs --field tag)
                  mkdir -p static/vencordDist installers
                  gh release download "$TAG" --dir static/vencordDist --clobber \
                      --pattern "vencordDesktop*.js" --pattern "vencordDesktopRenderer.css" \
                      --pattern "version.txt" --pattern "chunk-*.js"
                  gh release download "$TAG" --dir installers --clobber \
                      --pattern "*.exe" --pattern "*.AppImage" --pattern "*.deb" --pattern "*.rpm" \
                      --pattern "latest*.yml"
                  export DOCKVIEW_RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
                  export DOCKVIEW_INSTALLERS_DIR="$PWD/installers"
                  node scripts/make-plugin-manifest.mjs
                  node scripts/verify-dockview-release-metadata.mjs \
                      --version-file static/vencordDist/version.txt \
                      --manifest static/vencordDist/manifest.json \
                      --installers-dir installers \
                      --release-base "$DOCKVIEW_RELEASE_BASE" \
                      --latest-yml installers
                  gh release upload "$TAG" static/vencordDist/manifest.json --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
