name: Release

on:
    push:
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare bundled Vencord (+ DockView plugin)
              run: node scripts/prepare-vencord.mjs

            - name: Build
              run: pnpm build

            - name: Run Electron Builder
              run: pnpm electron-builder --${{ matrix.platform }} --publish never

            # electron-builder names a release after the app (Vesktop) version, but our
            # releases are versioned by the DockView plugin — so we don't let it publish.
            # We build the installers + electron-updater metadata (latest*.yml, which
            # carry the Vesktop version so Vesktop's own auto-update keeps working) and
            # upload them to a release TAGGED + TITLED by the DockView plugin version.
            # Both OS legs run this; the first to arrive creates the release, the rest
            # just add their platform's files.
            - name: Publish the DockView release
              shell: bash
              run: |
                  VER=$(grep -oE 'DOCKVIEW_PLUGIN_VERSION *= *"[^"]+"' plugin/version.ts | sed -E 's/.*"([^"]+)".*/\1/')
                  BASE=$(node -p "require('./package.json').version")
                  TAG="v$VER"
                  gh release create "$TAG" --title "dockview $VER" \
                      --notes "DockView $VER — a Discord attachment dock, on Vesktop $BASE." 2>/dev/null \
                      || gh release view "$TAG" >/dev/null
                  shopt -s nullglob
                  files=(dist/*.exe dist/*.exe.blockmap dist/*-win.zip \
                         dist/*.AppImage dist/*.deb dist/*.rpm dist/*.tar.gz \
                         dist/latest*.yml)
                  gh release upload "$TAG" "${files[@]}" --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Attach the DockView plugin bundle (the four vencordDesktop* files +
            # chunk-*.js + version.txt + a generated manifest.json) as EXTRA assets on
            # the same v* release. This is what the in-app updater (settings page ->
            # update plugin) fetches to update DockView WITHOUT reinstalling the app —
            # a SEPARATE channel from electron-updater (which tracks the Vesktop
            # version). The bundle is platform-independent, so only the LINUX leg
            # uploads it (avoids a needless second write from the Windows leg). Runs
            # AFTER "Publish the DockView release" so the release already exists.
            - name: Attach the DockView plugin bundle (for in-app updates)
              if: matrix.platform == 'linux'
              shell: bash
              run: |
                  VER=$(grep -oE 'DOCKVIEW_PLUGIN_VERSION *= *"[^"]+"' plugin/version.ts | sed -E 's/.*"([^"]+)".*/\1/')
                  TAG="v$VER"
                  export DOCKVIEW_RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
                  node scripts/make-plugin-manifest.mjs
                  shopt -s nullglob
                  files=(static/vencordDist/vencordDesktopMain.js static/vencordDist/vencordDesktopPreload.js \
                         static/vencordDist/vencordDesktopRenderer.js static/vencordDist/vencordDesktopRenderer.css \
                         static/vencordDist/version.txt static/vencordDist/manifest.json \
                         static/vencordDist/chunk-*.js)
                  gh release upload "$TAG" "${files[@]}" --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
