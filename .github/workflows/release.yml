name: Release

on:
    push:
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare bundled Vencord (+ DockView plugin)
              run: node scripts/prepare-vencord.mjs

            - name: Build
              run: pnpm build

            - name: Run Electron Builder
              run: pnpm electron-builder --${{ matrix.platform }} --publish never

            # electron-builder names a release after the app (Vesktop) version, but our
            # releases are versioned by the DockView plugin — so we don't let it publish.
            # We build the installers + electron-updater metadata (latest*.yml, which
            # carry the Vesktop version so Vesktop's own auto-update keeps working) and
            # upload them to a release TAGGED + TITLED by the DockView plugin version.
            # Both OS legs run this; the first to arrive creates the release, the rest
            # just add their platform's files.
            - name: Publish the DockView release
              shell: bash
              run: |
                  VER=$(grep -oE 'DOCKVIEW_PLUGIN_VERSION *= *"[^"]+"' plugin/version.ts | sed -E 's/.*"([^"]+)".*/\1/')
                  BASE=$(node -p "require('./package.json').version")
                  TAG="v$VER"
                  gh release create "$TAG" --title "dockview $VER" \
                      --notes "DockView $VER — a Discord attachment dock, on Vesktop $BASE." 2>/dev/null \
                      || gh release view "$TAG" >/dev/null
                  shopt -s nullglob
                  files=(dist/*.exe dist/*.exe.blockmap dist/*-win.zip \
                         dist/*.AppImage dist/*.deb dist/*.rpm dist/*.tar.gz \
                         dist/latest*.yml)
                  gh release upload "$TAG" "${files[@]}" --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Attach the DockView plugin bundle (the four vencordDesktop* files +
            # chunk-*.js + version.txt) as EXTRA assets on the same v* release. This is
            # what the in-app updater (settings page -> update plugin) fetches to update
            # DockView WITHOUT reinstalling the app — a SEPARATE channel from
            # electron-updater (which tracks the Vesktop version). The bundle is
            # platform-independent, so only the LINUX leg uploads it (avoids a needless
            # second write from the Windows leg). The manifest.json is NOT generated here
            # — it's built in the final "manifest" job below, once BOTH legs have uploaded
            # their installers, so the shell block can hash every platform's installer.
            - name: Attach the DockView plugin bundle (for in-app updates)
              if: matrix.platform == 'linux'
              shell: bash
              run: |
                  VER=$(grep -oE 'DOCKVIEW_PLUGIN_VERSION *= *"[^"]+"' plugin/version.ts | sed -E 's/.*"([^"]+)".*/\1/')
                  TAG="v$VER"
                  shopt -s nullglob
                  files=(static/vencordDist/vencordDesktopMain.js static/vencordDist/vencordDesktopPreload.js \
                         static/vencordDist/vencordDesktopRenderer.js static/vencordDist/vencordDesktopRenderer.css \
                         static/vencordDist/version.txt \
                         static/vencordDist/chunk-*.js)
                  gh release upload "$TAG" "${files[@]}" --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # A final, single-run job that generates manifest.json AFTER both OS legs have
    # uploaded their installers to the release. It DOWNLOADS the assets already on the
    # release — the plugin bundle files the linux leg uploaded and the installers from
    # both legs — and hashes exactly those, so the manifest's sha256s are guaranteed to
    # match the bytes the in-app updater will fetch (no dependency on a reproducible
    # rebuild). Running it once, after everything else, is what lets the manifest carry
    # BOTH the Linux and the Windows installers in its shell block.
    manifest:
        needs: release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Generate + upload the update manifest
              shell: bash
              run: |
                  VER=$(grep -oE 'DOCKVIEW_PLUGIN_VERSION *= *"[^"]+"' plugin/version.ts | sed -E 's/.*"([^"]+)".*/\1/')
                  TAG="v$VER"
                  # Pull the plugin bundle assets (the manifest generator hashes files out
                  # of static/vencordDist) so their sha256s match the uploaded bytes exactly.
                  # --clobber: the checkout already tracks placeholder copies of these
                  # files, and download refuses to overwrite without it.
                  mkdir -p static/vencordDist installers
                  gh release download "$TAG" --dir static/vencordDist --clobber \
                      --pattern "vencordDesktop*.js" --pattern "vencordDesktopRenderer.css" \
                      --pattern "version.txt" --pattern "chunk-*.js"
                  # Pull the installer assets (both legs) so the shell block records each
                  # platform's installer sha256 + size.
                  gh release download "$TAG" --dir installers --clobber \
                      --pattern "*.exe" --pattern "*.AppImage" --pattern "*.deb" --pattern "*.rpm" || true
                  export DOCKVIEW_RELEASE_BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
                  export DOCKVIEW_INSTALLERS_DIR="$PWD/installers"
                  node scripts/make-plugin-manifest.mjs
                  gh release upload "$TAG" static/vencordDist/manifest.json --clobber
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
