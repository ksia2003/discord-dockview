name: Release

on:
    push:
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare bundled Vencord (+ DockView plugin)
              run: node scripts/prepare-vencord.mjs

            - name: Build
              run: pnpm build

            - name: Run Electron Builder
              run: pnpm electron-builder --${{ matrix.platform }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # The GitHub release is named after the DockView product (e.g.
            # "dockview 0.1.0"), NOT the internal Vesktop app version (v1.6.5).
            # The tag stays v<vesktop> for electron-updater; only the display
            # title is the DockView version. Runs once (windows leg) and waits
            # for electron-builder to have created the release.
            - name: Title the release "dockview <version>"
              if: matrix.platform == 'windows'
              shell: bash
              run: |
                  VER=$(grep -oE 'DOCKVIEW_PLUGIN_VERSION *= *"[^"]+"' plugin/version.ts | sed -E 's/.*"([^"]+)".*/\1/')
                  for i in 1 2 3 4 5 6 7 8; do
                    if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
                      gh release edit "${{ github.ref_name }}" --title "dockview ${VER}"
                      echo "Titled release as: dockview ${VER}"
                      exit 0
                    fi
                    echo "release not ready yet, retry $i..."; sleep 8
                  done
                  echo "WARNING: release not found; title not set"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
