<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DockView HTML Artifact</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px;
         background: #1e1f22; color: #e3e5e8; }
  h1 { margin: 0 0 12px; font-size: 20px; }
  .card { background: #2b2d31; border-radius: 10px; padding: 18px; max-width: 360px; }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px;
           background: #5865f2; color: #fff; cursor: pointer; }
  #out { margin-top: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="card">
    <h1>Interactive artifact</h1>
    <p>A self-contained HTML artifact rendered in the dock's sandboxed iframe.</p>
    <button id="b">Clicked <span id="n">0</span> times</button>
    <div id="out">Open me, then click the button.</div>
  </div>
  <script>
    let n = 0;
    const span = document.getElementById('n');
    const out = document.getElementById('out');
    document.getElementById('b').addEventListener('click', () => {
      span.textContent = ++n;
      out.textContent = 'Live script running inside the dock — count = ' + n;
    });
  </script>
</body>
</html>
